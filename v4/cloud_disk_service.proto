// user_service.proto
syntax = "proto3";

message signup_request {
    string username = 1;
    string password = 2;
};

message signup_response {
    int32 state_code = 1;
    string message = 2;
};


message signin_request {
    string username = 1;
    string password = 2;
};

message signin_response {
    int32 state_code = 1;
    string username = 2;
    string token = 3;
    string location = 4;
};

service cloud_disk_service  {
    rpc signup(signup_request) returns (signup_response);
    rpc signin(signin_request) returns (signin_response);
}